services:
  navidrome:
    image: deluan/navidrome:0.63.2
    container_name: navidrome
    restart: unless-stopped
    environment:
      ND_LOGLEVEL: ${ND_LOGLEVEL}
      TZ: ${TZ}
    ports:
      - "4533:4533"
    volumes:
      - /mnt/media/navidrome/data:/data
      - /mnt/media/navidrome/music:/music:ro
    networks:
      - media

networks:
  media:
    external: true